<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pièces du trou sans fond</title>
<style>body{margin:0;background:#0b0b10;color:#e8e8ee;font:15px system-ui,sans-serif;padding:16px;text-align:center}button{background:#1c8a3a;color:#fff;border:1px solid #6fe08f;border-radius:6px;padding:10px 26px;font:700 16px system-ui;cursor:pointer;margin:8px 4px}
#sc{position:relative;width:min(92vw,520px);margin:0 auto}#sc img{width:100%;display:block;border-radius:17px}.mp3-calques{position:absolute;inset:0;aspect-ratio:1/1;container-type:inline-size;overflow:hidden;border-radius:17px;pointer-events:none}
.mp3-pieces{position:absolute;inset:0;pointer-events:none;clip-path:polygon(0 0,100% 0,100% 56%,56% 66%,54% 66%,50% 63.5%,45% 62%,40% 61%,38% 60%,33% 57%,29% 54%,0 54%)}   /* le bord proche du trou (le contour bas de la partie sombre, relevé sur l'image : de x 29 % y 54 % à x 56 % y 66 %) est au premier plan : une pièce qui le franchit disparaît derrière lui, et non plus dans l'herbe */
.mp3-chute{position:absolute;left:var(--x1);top:var(--y1);width:0;height:0;animation:mp3ChuteY var(--d) cubic-bezier(.11,0,.5,0) 1 both;animation-delay:var(--dl)}
.mp3-derive{position:absolute;left:0;top:0;width:0;height:0;animation:mp3ChuteX var(--d) linear 1 both;animation-delay:var(--dl)}
.mp3-echelle{position:absolute;left:0;top:0;width:0;height:0;opacity:0;animation:mp3ChuteE var(--d) linear 1 both;animation-delay:var(--dl)}
.mp3-pc{position:absolute;left:calc(var(--t)*-.5);top:calc(var(--t)*-.5);width:var(--t);height:var(--t);transform-style:preserve-3d;animation:mp3Tourne var(--d) linear 1 both;animation-delay:var(--dl)}
.mp3-pc>*{position:absolute;inset:0;border-radius:50%;backface-visibility:visible}
.mp3-tr{background:#a8700e;border:1px solid #6a4306}
.mp3-pc svg{width:100%;height:100%;display:block}
.mp3-fa{transform:translateZ(calc(var(--t)*.06))}
.mp3-fb{transform:rotateY(180deg) translateZ(calc(var(--t)*.06))}
/* pièce qui passe le bord : taille constante, aucun fondu (c'est le bord qui la cache) ; les autres rapetissent et s'effacent en fondu fermé dans le trou */
.mp3-dehors .mp3-echelle{animation-name:mp3ChuteD}
.mp3-chute:not(.mp3-dehors){animation-name:mp3ChuteYn}
@keyframes mp3ChuteD{0%{opacity:0;transform:scale(1)}9%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
@keyframes mp3ChuteY{0%{transform:translateY(-30cqw)}100%{transform:translateY(0)}}
@keyframes mp3ChuteX{0%{transform:translateX(var(--dx))}100%{transform:translateX(0)}}
/* pièce qui ne passe pas le bord (Norman, 2026-11-01) : elle CONTINUE sa chute dans le noir en rapetissant de plus en plus, puis s'efface en fondu à la fermeture ; aucun éclat */
@keyframes mp3ChuteE{0%{opacity:0;transform:scale(1);filter:brightness(1)}9%{opacity:1;transform:scale(1);filter:brightness(1)}55%{opacity:1;transform:scale(.62);filter:brightness(.55)}100%{opacity:0;transform:scale(.1);filter:brightness(.12)}}
@keyframes mp3ChuteYn{0%{transform:translateY(-30cqw)}100%{transform:translateY(9cqw)}}
@keyframes mp3Tourne{from{transform:rotateZ(var(--inc)) rotateX(var(--rx)) rotateY(0)}to{transform:rotateZ(var(--inc)) rotateX(var(--rx)) rotateY(calc(var(--tours)*360deg))}}

<div><button onclick="window.__jeterOrSalveV1__(4)">▶ 4 pièces</button><button onclick="window.__jeterOrSalveV1__(8)">▶ 8 pièces</button><button onclick="window.__jeterOrSalveV1__(14)">▶ 14 pièces</button></div>
<script>(function(){let compteurPiecesIdleV1_=0;
  function faceDePieceIdleV1_(){
    const u='mpc'+(++compteurPiecesIdleV1_);
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="'+u+'a" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff6c4"/><stop offset=".4" stop-color="#f6c540"/><stop offset=".8" stop-color="#c88a10"/><stop offset="1" stop-color="#8a5a06"/></radialGradient><linearGradient id="'+u+'b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#8a5a06"/></linearGradient></defs>'+
      '<circle cx="50" cy="50" r="49" fill="#6a4306"/><circle cx="50" cy="50" r="46" fill="url(#'+u+'a)"/><circle cx="50" cy="50" r="46" fill="none" stroke="url(#'+u+'b)" stroke-width="6"/>'+
      '<circle cx="50" cy="50" r="33" fill="none" stroke="#8a5a06" stroke-width="3"/><circle cx="50" cy="50" r="30.5" fill="none" stroke="#fff3b0" stroke-width="1.4" opacity=".7"/>'+
      '<path d="M50 29 L61 50 L50 71 L39 50Z" fill="#b87a10" stroke="#6a4306" stroke-width="2"/><path d="M50 29 L61 50 L50 50Z" fill="#fff3b0" opacity=".55"/>'+
      '<path d="M18 36 A36 36 0 0 1 44 15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/></svg>';
  }
  function pieceDeOrIdleV1_(p,dl){
    let tr='';
    for(let k=-3;k<=3;k++)tr+='<i class="mp3-tr" style="transform:translateZ(calc(var(--t)*'+(k*0.012)+'))"></i>';
    const st='--x1:'+p.x+'%;--y1:'+p.y+'%;--d:'+p.d+'s;--dl:'+dl+'s;--dx:'+p.dx+'cqw;--t:'+p.t+'cqw;--tours:'+p.tours+';--rx:'+p.rx+'deg;--inc:'+p.inc+'deg;';
    const face=faceDePieceIdleV1_();
    return '<div class="mp3-chute'+(p.dehors?' mp3-dehors':'')+'" style="'+st+'"><div class="mp3-derive"><div class="mp3-echelle" style="perspective:90cqw"><div class="mp3-pc">'+tr+'<div class="mp3-fa">'+face+'</div><div class="mp3-fb">'+faceDePieceIdleV1_()+'</div></div></div></div></div>'+
      '';
  }
  window.__jeterOrSalveV1__=function(n){
    n=Math.max(1,Math.min(14,Math.round(Number(n))||8));
    const calques=document.querySelector('.mp3-calques');
    if(!calques)return;
    const r=function(k){return (Math.sin(k*91.7)+1)/2;};
    let h='';
    for(let i=0;i<n;i++){
      /* ~40 % des pièces passent le bord proche du trou (sa lèvre, y 60 à 66 % selon x) : le bord est au premier plan, elles disparaissent en le franchissant (calque coupé en CSS) ; les autres tombent dans le noir (y 50 à 56 %) en rapetissant et en s'effaçant */
      const dehors=r(i+11)<.4;
      const p={dehors:dehors,x:(36+r(i+1)*13).toFixed(1),y:(dehors?68+r(i+7)*4:50+r(i+7)*6).toFixed(1),dx:((r(i+3)-.5)*30).toFixed(1),t:(3.8+r(i+5)*1.2).toFixed(2),tours:2+Math.round(r(i+9)*3)/2,rx:(12+r(i+2)*34).toFixed(0),inc:((r(i+4)-.5)*50).toFixed(0),d:(1.0+((i*37)%5)*0.1).toFixed(2)};
      h+=pieceDeOrIdleV1_(p,(i/n*0.55).toFixed(2));
    }
    /* une salve à la fois : l'ancienne est remplacée (son bloc porte data-morph-garder : le redessin de la page ne le retire pas) */
    let c=calques.querySelector('.mp3-pieces');
    if(!c){c=document.createElement('div');c.className='mp3-pieces';c.setAttribute('data-morph-garder','');calques.appendChild(c);}
    c.innerHTML=h;
    clearTimeout(c.__fin);
    c.__fin=setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},2600);
  };

  })();</script></body></html>
