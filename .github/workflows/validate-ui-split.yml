name: Validate UI split branch
on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/validate-ui-split.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: |
          set -e
          for f in cloudflare/tests/*.test.mjs; do
            echo "=== $f ==="
            node "$f"
          done
      - name: Build standalone frontend
        run: |
          set -e
          node cloudflare/build-standalone.mjs
          node --check cloudflare/public/standalone-bridge.js
          for f in cloudflare/public/modules/*.js; do node --check "$f"; done
          node --check cloudflare/public/soreal-idle-ui.js
