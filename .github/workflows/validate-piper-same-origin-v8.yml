name: Validate Piper same-origin V8

on:
  push:
    branches:
      - fix/piper-same-origin-v8
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run full test suite
        run: |
          set -euo pipefail
          for f in cloudflare/tests/*.test.mjs; do
            echo "=== $f ==="
            node "$f"
          done

      - name: Build standalone frontend
        run: |
          set -euo pipefail
          node cloudflare/build-standalone.mjs
          node --check cloudflare/public/standalone-bridge.js
          for f in cloudflare/public/modules/*.js; do
            node --check "$f"
          done
          node --check cloudflare/public/soreal-idle-ui.js

      - name: Install Chromium smoke runtime
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run same-origin Piper browser smoke
        run: |
          set -euo pipefail
          cat > .piper-v8-server.mjs <<'NODE'
          import http from "node:http";
          import fs from "node:fs/promises";
          import path from "node:path";

          const root=path.resolve("cloudflare/public");
          const modelBase="https://huggingface.co/spaces/ayousanz/piper-plus-demo/resolve/main/models/multilingual-test-medium.onnx";
          const html=`<!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <script type="importmap">
              {"imports":{
                "piper-plus":"https://cdn.jsdelivr.net/npm/piper-plus@0.7.0/src/index.js",
                "@piper-plus/g2p":"https://cdn.jsdelivr.net/npm/@piper-plus/g2p@0.4.2/src/index.js",
                "onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.min.mjs"
              }}
            </script>
          </head>
          <body>
            <script type="module" src="/modules/local-neural-piper-v1.js?v=3"></script>
            <script src="/modules/tutorial-tts-v202.js?v=226"></script>
          </body>
          </html>`;

          const mime=file=>file.endsWith(".js")?"text/javascript":
            file.endsWith(".mjs")?"text/javascript":
            file.endsWith(".json")?"application/json":
            "application/octet-stream";

          const server=http.createServer(async (req,res)=>{
            try{
              const u=new URL(req.url,"http://127.0.0.1:4173");
              if(u.pathname==="/"){
                res.writeHead(200,{"content-type":"text/html; charset=utf-8","cache-control":"no-store"});
                res.end(html);
                return;
              }
              if(u.pathname==="/api/idle/media/piper-model.onnx"||u.pathname==="/api/idle/media/piper-model.onnx.json"){
                const upstream=await fetch(modelBase+(u.pathname.endsWith(".json")?".json":""));
                if(!upstream.ok){
                  res.writeHead(502,{"cache-control":"no-store"});
                  res.end("upstream "+upstream.status);
                  return;
                }
                const body=Buffer.from(await upstream.arrayBuffer());
                res.writeHead(200,{
                  "content-type":u.pathname.endsWith(".json")?"application/json":"application/octet-stream",
                  "cache-control":"public, max-age=604800, immutable"
                });
                res.end(body);
                return;
              }
              const safe=path.normalize(u.pathname).replace(/^([.][.][/\\])+/, "").replace(/^[/\\]+/,"");
              const file=path.join(root,safe);
              if(!file.startsWith(root)){
                res.writeHead(403);res.end("forbidden");return;
              }
              const body=await fs.readFile(file);
              res.writeHead(200,{"content-type":mime(file)});
              res.end(body);
            }catch(error){
              res.writeHead(404,{"content-type":"text/plain"});
              res.end(String(error?.message||error));
            }
          });
          server.listen(4173,"127.0.0.1",()=>console.log("Piper V8 test server ready"));
          NODE

          node .piper-v8-server.mjs >/tmp/piper-v8-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          SOREAL_IDLE_URL=http://127.0.0.1:4173/             node cloudflare/tests/idle-piper-production-origin.smoke.mjs
