name: Deploy SOREAL Idle to Cloudflare

# Dépôt extrait de SOREAL-TV le 2026-09-15 pour isoler le moteur du jeu.
# Toute publication de main passe par la suite complète, le build autonome,
# puis une vérification du SHA réellement annoté sur le déploiement Cloudflare.
on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

# Droits minimaux : le workflow ne fait que lire le dépôt (checkout). Le déploiement utilise le secret CLOUDFLARE_API_TOKEN,
# jamais le jeton GitHub.
permissions:
  contents: read

# Un run déjà commencé n'est JAMAIS annulé : avec cancel-in-progress: true, un push arrivant après `wrangler deploy` mais avant
# « Verify deployed Git SHA » ou le smoke Chromium laissait un SHA en production sans validation complète (et, si le run
# suivant échouait aux tests, ce SHA y restait). Désormais le run en cours va jusqu'au bout ; GitHub ne garde qu'UN run en
# attente (le plus récent, les intermédiaires sont abandonnés avant de commencer).
concurrency:
  group: soreal-idle-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Audit du 2026-10-10 (IDLE-AUDIT-CI-003 et CI-007) : seule la branche main déploie, même lancé à la main (workflow_dispatch), et un run bloqué ne peut pas
    # occuper la file de concurrence plus de 30 minutes.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: ubuntu-22.04   # ubuntu-latest passe a Ubuntu 26 (Playwright 1.55 n'y installe plus Chromium) ; ubuntu-24.04 est reste « Queued » plus de 10 min (run #1057)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version de Node épinglée : les tests sont validés localement sous Node 24, le runner ne doit pas dériver avec l'image.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Moteur local versionne (cloudflare/public/moteur-local-worker-v1.js + sql-wasm-v1.wasm, AGENTS.md regle n°7) : le workflow ne le reconstruisait pas et le test
      # idle-moteur-local-v1 ne verifie que la coherence des empreintes, pas que le fichier correspond a cloudflare/src. On le regenere donc et on echoue s'il differe.
      - name: Verify local engine bundle is up to date
        shell: bash
        run: |
          set -euo pipefail
          (cd cloudflare/local && npm ci --no-audit --no-fund)
          node cloudflare/tools/build-moteur-local.mjs
          if ! git diff --exit-code -- cloudflare/public/moteur-local-worker-v1.js cloudflare/public/sql-wasm-v1.wasm cloudflare/public/modules/moteur-local-v1.js; then
            echo "::error::Le moteur local versionne est perime par rapport a cloudflare/src : relance node cloudflare/tools/build-moteur-local.mjs puis node cloudflare/tools/maj-pins.mjs, et committe le resultat."
            exit 1
          fi

      # Tests EN PARALLELE (4 a la fois, Norman 2026-11-06 : la CI prenait 11 minutes). Meme garde-fou qu'avant : un seul test en echec bloque le deploiement.
      # Les tests sont independants (verifie : suite complete locale en parallele = memes resultats qu'en serie). Le journal d'un test n'est affiche que s'il echoue.
      - name: Run test suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tests-logs"
          export LOGS="$RUNNER_TEMP/tests-logs"
          ls cloudflare/tests/*.test.mjs | xargs -P 4 -I{} bash -c 'f="{}"; log="$LOGS/$(basename "$f").log"; if node "$f" >"$log" 2>&1; then echo "OK $f"; else echo "=== ECHEC $f ==="; cat "$log"; exit 255; fi'

      - name: Build standalone frontend
        run: |
          set -e
          node cloudflare/build-standalone.mjs
          node --check cloudflare/public/standalone-bridge.js
          for f in cloudflare/public/modules/*.js; do
            node --check "$f"
          done
          node --check cloudflare/public/soreal-idle-ui.js

      - name: Deploy SOREAL Idle Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/soreal-idle-wrangler-output.jsonl
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 deploy \
            --config wrangler.jsonc \
            --message "git:$GITHUB_SHA"

      - name: Verify deployed Git SHA
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          status="$RUNNER_TEMP/soreal-idle-deployment-status.json"
          npx --yes wrangler@4.127.1 deployments status --config wrangler.jsonc --json > "$status"

          DEPLOYMENT_STATUS_FILE="$status" \
          EXPECTED="git:$GITHUB_SHA" \
          node <<'NODE'
          const fs=require("node:fs");
          const parsed=JSON.parse(
            fs.readFileSync(process.env.DEPLOYMENT_STATUS_FILE,"utf8")
          );

          const deployment=
            parsed?.deployment||
            parsed?.result?.deployment||
            parsed?.result||
            parsed;

          const versions=Array.isArray(deployment?.versions)
            ? deployment.versions
            : [];
          const active=versions
            .slice()
            .sort((a,b)=>Number(b?.percentage||0)-Number(a?.percentage||0))[0]||null;

          const versionId=String(
            active?.version_id||
            active?.versionId||
            active?.id||
            ""
          );
          const percentage=Number(active?.percentage||0);
          const message=String(
            deployment?.annotations?.["workers/message"]||
            deployment?.message||
            ""
          );

          if(!versionId||percentage!==100){
            console.error("SOREAL IDLE production routing non vérifiable:",{
              versionId:versionId||"absent",
              percentage
            });
            process.exit(1);
          }

          if(message!==process.env.EXPECTED){
            console.error("SOREAL IDLE production SHA mismatch:",{
              expected:process.env.EXPECTED,
              observed:message||"absent",
              versionId
            });
            process.exit(1);
          }

          console.log("SOREAL IDLE production SHA verified:",{
            sha:process.env.EXPECTED.slice(4),
            versionId,
            percentage
          });
          NODE


