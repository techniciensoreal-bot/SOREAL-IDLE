name: Deploy SOREAL Idle to Cloudflare

# Dépôt extrait de SOREAL-TV le 2026-09-15 pour isoler le moteur du jeu.
# Toute publication de main passe par la suite complète, le build autonome,
# puis une vérification du SHA réellement annoté sur le déploiement Cloudflare.
on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: soreal-idle-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        run: |
          set -e
          for f in cloudflare/tests/*.test.mjs; do
            echo "=== $f ==="
            node "$f"
          done

      - name: Build standalone frontend
        run: |
          set -e
          node cloudflare/build-standalone.mjs
          node --check cloudflare/public/standalone-bridge.js
          for f in cloudflare/public/modules/*.js; do
            node --check "$f"
          done
          node --check cloudflare/public/soreal-idle-ui.js

      - name: Deploy SOREAL Idle Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/soreal-idle-wrangler-output.jsonl
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 deploy \
            --config wrangler.jsonc \
            --message "git:$GITHUB_SHA"

      - name: Verify local neural dependencies
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://cdn.jsdelivr.net/npm/piper-plus@0.7.0/src/index.js"
            "https://cdn.jsdelivr.net/npm/@piper-plus/g2p@0.4.2/src/index.js"
            "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.min.mjs"
            "https://huggingface.co/spaces/ayousanz/piper-plus-demo/resolve/main/models/multilingual-test-medium.onnx.json"
            "https://huggingface.co/spaces/ayousanz/piper-plus-demo/resolve/main/models/multilingual-test-medium.onnx"
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json"
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx"
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/gilles/low/fr_FR-gilles-low.onnx.json"
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/gilles/low/fr_FR-gilles-low.onnx"
          )

          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --head --max-time 45 "$url" >/dev/null
          done

      - name: Verify deployed Git SHA
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          status="$RUNNER_TEMP/soreal-idle-deployment-status.json"
          npx --yes wrangler@4.127.1 deployments status --config wrangler.jsonc --json > "$status"

          DEPLOYMENT_STATUS_FILE="$status" \
          EXPECTED="git:$GITHUB_SHA" \
          node <<'NODE'
          const fs=require("node:fs");
          const parsed=JSON.parse(
            fs.readFileSync(process.env.DEPLOYMENT_STATUS_FILE,"utf8")
          );

          const deployment=
            parsed?.deployment||
            parsed?.result?.deployment||
            parsed?.result||
            parsed;

          const versions=Array.isArray(deployment?.versions)
            ? deployment.versions
            : [];
          const active=versions
            .slice()
            .sort((a,b)=>Number(b?.percentage||0)-Number(a?.percentage||0))[0]||null;

          const versionId=String(
            active?.version_id||
            active?.versionId||
            active?.id||
            ""
          );
          const percentage=Number(active?.percentage||0);
          const message=String(
            deployment?.annotations?.["workers/message"]||
            deployment?.message||
            ""
          );

          if(!versionId||percentage!==100){
            console.error("SOREAL IDLE production routing non vérifiable:",{
              versionId:versionId||"absent",
              percentage
            });
            process.exit(1);
          }

          if(message!==process.env.EXPECTED){
            console.error("SOREAL IDLE production SHA mismatch:",{
              expected:process.env.EXPECTED,
              observed:message||"absent",
              versionId
            });
            process.exit(1);
          }

          console.log("SOREAL IDLE production SHA verified:",{
            sha:process.env.EXPECTED.slice(4),
            versionId,
            percentage
          });
          NODE


      - name: Verify deployed Piper narration in Chromium
        shell: bash
        env:
          SOREAL_IDLE_URL: https://soreal-idle.technicien-soreal.workers.dev/
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node cloudflare/tests/idle-piper-production-origin.smoke.mjs
