name: Deploy SOREAL Idle to Cloudflare

# Dépôt extrait de SOREAL-TV le 2026-09-15 pour isoler le moteur du jeu.
# Toute publication de main passe par la suite complète, le build autonome,
# puis une vérification du SHA réellement annoté sur le déploiement Cloudflare.
on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: soreal-idle-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        run: |
          set -e
          for f in cloudflare/tests/*.test.mjs; do
            echo "=== $f ==="
            node "$f"
          done

      - name: Build standalone frontend
        run: |
          set -e
          node cloudflare/build-standalone.mjs
          node --check cloudflare/public/standalone-bridge.js
          for f in cloudflare/public/modules/*.js; do
            node --check "$f"
          done
          node --check cloudflare/public/soreal-idle-ui.js

      - name: Deploy SOREAL Idle Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/soreal-idle-wrangler-output.jsonl
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 deploy \
            --config wrangler.jsonc \
            --message "git:$GITHUB_SHA"

      - name: Verify deployed Git SHA
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_DEPLOY_OUTPUT: ${{ runner.temp }}/soreal-idle-wrangler-output.jsonl
        run: |
          set -euo pipefail

          deployments="$RUNNER_TEMP/soreal-idle-deployments.json"
          versions="$RUNNER_TEMP/soreal-idle-versions.json"

          npx --yes wrangler@4.127.1 deployments list --config wrangler.jsonc --json > "$deployments"
          npx --yes wrangler@4.127.1 versions list --config wrangler.jsonc --json > "$versions"

          DEPLOYMENTS_FILE="$deployments" \
          VERSIONS_FILE="$versions" \
          EXPECTED="git:$GITHUB_SHA" \
          node <<'NODE'
          const fs=require("node:fs");

          function parseJson(path){
            return JSON.parse(fs.readFileSync(path,"utf8"));
          }
          function asDeployments(parsed){
            if(Array.isArray(parsed))return parsed;
            if(Array.isArray(parsed?.deployments))return parsed.deployments;
            if(Array.isArray(parsed?.result))return parsed.result;
            if(Array.isArray(parsed?.result?.deployments))return parsed.result.deployments;
            return [];
          }
          function asVersions(parsed){
            if(Array.isArray(parsed))return parsed;
            if(Array.isArray(parsed?.versions))return parsed.versions;
            if(Array.isArray(parsed?.result))return parsed.result;
            if(Array.isArray(parsed?.result?.versions))return parsed.result.versions;
            return [];
          }
          function versionId(value){
            return String(
              value?.version_id||
              value?.versionId||
              value?.id||
              value?.version?.id||
              ""
            );
          }
          function versionMessage(value){
            return String(
              value?.annotations?.["workers/message"]||
              value?.metadata?.annotations?.["workers/message"]||
              value?.message||
              value?.metadata?.message||
              ""
            );
          }

          const deployments=asDeployments(parseJson(process.env.DEPLOYMENTS_FILE));
          const versions=asVersions(parseJson(process.env.VERSIONS_FILE));
          const latest=deployments[0]||null;
          const traffic=Array.isArray(latest?.versions)?latest.versions:[];
          const active=traffic
            .slice()
            .sort((a,b)=>Number(b?.percentage||0)-Number(a?.percentage||0))[0]||null;
          const activeId=versionId(active);
          const activePct=Number(active?.percentage||0);

          if(!activeId||activePct!==100){
            console.error("SOREAL IDLE production routing non vérifiable:",{
              activeVersionId:activeId||"absent",
              percentage:activePct,
              deploymentId:latest?.id||"absent"
            });
            process.exit(1);
          }

          const deployedVersion=versions.find(v=>versionId(v)===activeId)||null;
          const message=versionMessage(deployedVersion);

          if(message!==process.env.EXPECTED){
            console.error("SOREAL IDLE production SHA mismatch:",{
              expected:process.env.EXPECTED,
              activeVersionId:activeId,
              observed:message||"absent"
            });
            process.exit(1);
          }

          console.log("SOREAL IDLE production SHA verified:",{
            sha:process.env.EXPECTED.slice(4),
            versionId:activeId,
            percentage:activePct
          });
          NODE
