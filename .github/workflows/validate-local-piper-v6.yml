name: Validate local Piper V6 branch

on:
  push:
    branches:
      - work/local-piper-v6
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run full test suite
        run: |
          set -euo pipefail
          for f in cloudflare/tests/*.test.mjs; do
            echo "=== $f ==="
            node "$f"
          done

      - name: Build standalone frontend
        run: |
          set -euo pipefail
          node cloudflare/build-standalone.mjs
          node --check cloudflare/public/standalone-bridge.js
          for f in cloudflare/public/modules/*.js; do
            node --check "$f"
          done
          node --check cloudflare/public/soreal-idle-ui.js

      - name: Verify pinned Piper dependencies
        run: |
          set -euo pipefail
          urls=(
            "https://cdn.jsdelivr.net/npm/piper-plus@0.7.0/src/index.js"
            "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.min.mjs"
            "https://huggingface.co/ayousanz/piper-plus-css10-ja-6lang/resolve/main/config.json"
            "https://huggingface.co/ayousanz/piper-plus-css10-ja-6lang/resolve/main/css10-ja-6lang-fp16.onnx"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --head --max-time 45 "$url" >/dev/null
          done

      - name: Install Chromium smoke-test runtime
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real French Piper synthesis in Chromium
        run: |
          set -euo pipefail
          cat > cloudflare/public/__piper-smoke.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <script type="importmap">
              {
                "imports": {
                  "piper-plus": "https://cdn.jsdelivr.net/npm/piper-plus@0.7.0/src/index.js",
                  "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.min.mjs"
                }
              }
            </script>
          </head>
          <body>
            <script type="module" src="/modules/local-neural-piper-v1.js?v=1"></script>
          </body>
          </html>
          HTML

          python3 -m http.server 4173 --directory cloudflare/public >/tmp/soreal-piper-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/__piper-smoke.html >/dev/null; then
              break
            fi
            sleep 1
          done

          node cloudflare/tests/idle-local-piper-browser-smoke.mjs
