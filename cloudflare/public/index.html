  <style>
    /* Accessibilité : laisser le navigateur gérer le zoom/pinch. */
    html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;background:#071226;color:#eef5ff}
    #app{min-height:100vh}
    .soreal-idle-standalone-status{
      width:100%;min-height:100vh;margin:0;padding:24px;
      box-sizing:border-box;display:flex;align-items:center;justify-content:center;
      background:
        radial-gradient(circle at 50% 20%,rgba(47,112,218,.30),transparent 38%),
        linear-gradient(180deg,#0b1b39 0%,#071226 60%,#050b16 100%);
    }
    /*
     * Écran de lancement (Norman, 2026-10-29) : l'AFFICHE VERTICALE de l'entrée Steam (600 x 900), le logo « SOREAL NGU IDLE » posé en haut comme Steam le superpose à la bannière, la barre de chargement en bas. La barre suit les vraies étapes
     * du chargement (voir le script plus bas) ; les identifiants standaloneStatus / standaloneProgress / standalonePercent et la zone de connexion (ajoutée sous l'affiche) sont inchangés.
     */
    .soreal-idle-loading-card{
      width:min(460px,calc(100vw - 24px),calc((100vh - 24px) * 2 / 3));box-sizing:border-box;
      display:flex;flex-direction:column;gap:10px;align-items:stretch;
    }
    .ls-affiche{
      position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:18px;
      border:3px solid #000;box-shadow:6px 6px 0 #000,0 24px 70px rgba(0,0,0,.55);background:#0b1b39;
    }
    .ls-fond{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
    .ls-voile{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,10,24,.55) 0%,rgba(4,10,24,0) 30%,rgba(4,10,24,0) 62%,rgba(4,10,24,.88) 100%)}
    .ls-logo{position:absolute;left:3%;top:2.5%;width:94%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
    .ls-bas{position:absolute;left:0;right:0;bottom:0;padding:0 7% 5.5%}
    #standaloneStatus{
      min-height:18px;margin-bottom:8px;text-align:center;font-size:13px;letter-spacing:.04em;
      font-weight:800;color:#ffe9b0;text-shadow:0 2px 6px #000,0 0 12px rgba(0,0,0,.8);
    }
    #standaloneStatus.error{color:#ff9eae}
    .soreal-idle-loading-track{
      position:relative;height:18px;margin:0;overflow:hidden;
      border-radius:6px;background:#1a1204;border:3px solid #000;
      box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 2px #ffb000,0 4px 12px rgba(0,0,0,.6);
    }
    /* Barre de chargement (Norman, 2026-10-24) : elle suit les VRAIES étapes du chargement (scripts, connexion, moteur local, première image) ; animée par la carte graphique (Web Animations sur transform), donc fluide même quand les scripts occupent la page. Aspect ambre à rayures, comme le chargement de l'OS du jeu (2026-10-29). */
    #standaloneProgress{
      width:100%;height:100%;border-radius:inherit;transform-origin:0 50%;transform:scaleX(.08);
      background:repeating-linear-gradient(135deg,#ffb000 0 9px,#d98c00 9px 18px);
      box-shadow:0 0 14px rgba(255,176,0,.6);
    }
    #standalonePercent{
      margin-top:6px;text-align:right;
      font-size:12px;font-weight:900;color:#ffd24a;text-shadow:0 2px 5px #000;
    }
    /* PC (Norman, 2026-10-29 : « pour la version PC, il faut l'image en horizontale, la grande ») : la grande bannière horizontale de Steam (1920 x 620), le logo au centre, la barre en bas ; l'affiche verticale reste pour le téléphone. */
    @media (min-width:821px) and (orientation:landscape){
      .soreal-idle-loading-card{width:min(1180px,calc(100vw - 40px),calc((100vh - 40px) * 1920 / 620))}

      .ls-voile{background:linear-gradient(180deg,rgba(4,10,24,.35) 0%,rgba(4,10,24,0) 28%,rgba(4,10,24,0) 55%,rgba(4,10,24,.85) 100%)}
      .ls-logo{left:50%;top:3%;width:auto;height:70%;transform:translateX(-50%)}
      .ls-bas{padding:0 22% 2.6%}
      #standaloneStatus{margin-bottom:5px;font-size:13px}
      .soreal-idle-loading-track{height:16px}
      #standalonePercent{margin-top:3px;font-size:11px}
    }
    @media(max-width:520px){
      .soreal-idle-standalone-status{padding:12px}
      .ls-affiche{border-radius:14px}
    }

  <script>
    var SOREAL_SESSION="";
    var SOREAL_USER={};
    var PAGE_ACTIVE="idle";
    function header(){return "";}

    /*
     * Progression réelle : chaque étape franchie fait avancer la barre jusqu'à son palier (window.__SOREAL_IDLE_CHARGEMENT_ETAPE_V1__(pourcentage)) ; entre deux étapes elle avance doucement (quelques %) pour montrer que ça travaille, sans jamais dépasser le palier suivant.
     * Étapes : 8 % départ · 30 % scripts chargés · 42 % connexion validée · 52 % interface ouverte · 65 % partie téléchargée · 80 % moteur local démarré · 100 % première image du jeu. Après un rechargement (préférences du compte...), elle repart du dernier pourcentage affiché.
     */
    (function(){
      var CLE="soreal_idle_chargement_v1";
      var cible=8,anim=null,termine=false;
      function barre(){return document.getElementById("standaloneProgress");}
      function lire(){
        var b=barre();if(!b)return cible;
        try{var m=new DOMMatrixReadOnly(getComputedStyle(b).transform);return Math.max(0,Math.min(100,m.a*100));}catch(e){return cible;}
      }
      function aller(vers,creep){
        var b=barre();if(!b||termine)return;
        var de=Math.min(lire(),vers);
        var haut=Math.min(94,vers+creep);
        try{
          if(anim)anim.cancel();
          anim=b.animate([
            {transform:"scaleX("+(de/100)+")",offset:0,easing:"cubic-bezier(.2,.7,.3,1)"},
            {transform:"scaleX("+(vers/100)+")",offset:.07,easing:"linear"},
            {transform:"scaleX("+(haut/100)+")",offset:1}
          ],{duration:14000,fill:"forwards"});
        }catch(e){b.style.transform="scaleX("+(vers/100)+")";}
      }
      var reduit=false;try{reduit=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
      window.__SOREAL_IDLE_CHARGEMENT_ETAPE_V1__=function(pct){
        if(termine||!(pct>cible))return;
        cible=pct;
        aller(pct,pct>=100?0:6);
      };
      try{
        var m=JSON.parse(sessionStorage.getItem(CLE)||"null");
        if(m&&Date.now()-m.at<20000&&m.pct>8&&m.pct<94)cible=Math.round(m.pct);
      }catch(e){}
      var b0=barre();if(b0&&cible>8)b0.style.transform="scaleX("+(cible/100)+")";
      aller(cible,reduit?0:6);
      document.addEventListener("DOMContentLoaded",function(){window.__SOREAL_IDLE_CHARGEMENT_ETAPE_V1__(30);});
      var timer=setInterval(function(){
        var bar=barre(),label=document.getElementById("standalonePercent");
        if(!bar||!label){clearInterval(timer);try{sessionStorage.removeItem(CLE);}catch(e){}return;}
        var pct=lire();
        label.textContent=Math.round(pct)+" %";
        try{sessionStorage.setItem(CLE,JSON.stringify({pct:pct,at:Date.now()}));}catch(e){}
      },250);
      window.__SOREAL_IDLE_LOADING_COMPLETE_V206__=function(){
        window.__SOREAL_IDLE_CHARGEMENT_ETAPE_V1__(100);
        termine=true;
        var bar=barre(),label=document.getElementById("standalonePercent");
        if(bar){try{if(anim)anim.cancel();}catch(e){}bar.style.transform="scaleX(1)";}
        if(label)label.textContent="100 %";
        clearInterval(timer);
        try{sessionStorage.removeItem(CLE);}catch(e){}
      };
    })();
  </script>
