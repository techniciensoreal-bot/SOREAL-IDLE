  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <!-- Pas de barre blanche en bas (même correctif que SOREAL APP, 2026-10-03) : sous les boutons de navigation d'Android (bord à bord), la page montrait du blanc faute de fond sur <html> et de schéma de couleurs sombre. -->
  <style>html{background:#071226;color-scheme:dark}</style>
  <!--
    2026-09-23 (audit, suite) : frame-ancestors est IGNORÉ par les
    navigateurs quand livré via ce <meta> (confirmé en direct, erreur
    console) -- appliqué via un vrai en-tête HTTP côté Worker
    (idle-worker-entry-v1.js) à la place. object-src/base-uri restent
    ici en défense en profondeur (sans risque de régression : n'affectent
    ni le WASM, ni les styles inline, ni le chargement de scripts) --
    une politique script-src/style-src stricte nécessiterait de tester
    en direct tout le pipeline audio avant de la déployer, volontairement
    pas ajoutée dans cette passe.
  -->
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
  <!-- Un vrai jeu, pas une page web (2026-10-04) : textes non sélectionnables ni copiables, pas de menu du navigateur ; les champs de saisie restent normaux (modules/anti-copie-v1.js). -->
  <style id="soreal-idle-anti-copie-v1">html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,select,[contenteditable=""],[contenteditable="true"],[data-copie-autorisee],[data-copie-autorisee] *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}img{-webkit-user-drag:none}</style>

  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

  <style>
    /* Accessibilité : laisser le navigateur gérer le zoom/pinch. */
    html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;background:#071226;color:#eef5ff}
    #app{min-height:100vh}
    .soreal-idle-standalone-status{
      width:100%;min-height:100vh;margin:0;padding:24px;
      box-sizing:border-box;display:flex;align-items:center;justify-content:center;
      background:
        radial-gradient(circle at 50% 20%,rgba(47,112,218,.30),transparent 38%),
        linear-gradient(180deg,#0b1b39 0%,#071226 60%,#050b16 100%);
    }
    .soreal-idle-loading-card{
      width:min(650px,calc(100vw - 28px));box-sizing:border-box;
      padding:14px 14px 18px;border-radius:19px;
      background:#0d1830;border:1px solid rgba(102,156,244,.40);
      box-shadow:0 24px 70px rgba(0,0,0,.48),inset 0 0 35px rgba(54,112,210,.08);
    }
    .soreal-idle-loading-banner{
      width:100%;aspect-ratio:3/1;display:block;object-fit:cover;
      border-radius:12px;border:1px solid rgba(129,176,255,.35);
      box-shadow:0 10px 28px rgba(0,0,0,.34);background:#091329;
    }
    .soreal-idle-loading-title{
      margin:13px 0 3px;text-align:center;font-size:19px;font-weight:950;
      letter-spacing:.08em;color:#edf5ff;text-shadow:0 2px 12px rgba(67,136,255,.45);
    }
    #standaloneStatus{
      min-height:18px;margin-top:6px;text-align:center;font-size:12px;
      font-weight:800;color:#9eb9e7;
    }
    #standaloneStatus.error{color:#ff9eae}
    .soreal-idle-loading-track{
      position:relative;height:13px;margin:13px 8px 2px;overflow:hidden;
      border-radius:999px;background:#050b17;border:1px solid rgba(121,164,235,.24);
      box-shadow:inset 0 2px 6px rgba(0,0,0,.55);
    }
    #standaloneProgress{
      width:8%;height:100%;border-radius:inherit;
      background:linear-gradient(90deg,#2f72d9,#57a0ff,#74bbff);
      box-shadow:0 0 16px rgba(72,151,255,.55);
      transition:width .32s ease;
    }
    #standalonePercent{
      margin-top:6px;text-align:right;padding-right:8px;
      font-size:10px;font-weight:900;color:#7898ca;
    }
    @media(max-width:520px){
      .soreal-idle-standalone-status{padding:12px}
      .soreal-idle-loading-card{padding:10px 10px 14px;border-radius:15px}
      .soreal-idle-loading-title{font-size:16px}
    }
  </style>
</head>

          src="https://drive.google.com/thumbnail?id=1omNowtqq_YjUQitljdBXbLK9VZ0oJ7qb&sz=w1200"
          fetchpriority="high"
          alt="SOREAL IDLE"
        >
        <div class="soreal-idle-loading-title">SOREAL IDLE</div>
        <div id="standaloneStatus">Initialisation…</div>
        <div class="soreal-idle-loading-track"><div id="standaloneProgress"></div></div>
        <div id="standalonePercent">8 %</div>

  <script>
    var SOREAL_SESSION="";
    var SOREAL_USER={};
    var PAGE_ACTIVE="idle";
    function header(){return "";}

    /* V206 — retour de l'ancien écran bleu APP/TV avec progression douce. */
    (function(){
      var pct=8;
      var timer=setInterval(function(){
        var bar=document.getElementById("standaloneProgress");
        var label=document.getElementById("standalonePercent");
        if(!bar||!label){clearInterval(timer);return;}
        pct=Math.min(94,pct+(pct<55?4:pct<80?2:1));
        bar.style.width=pct+"%";
        label.textContent=pct+" %";
      },360);
      window.__SOREAL_IDLE_LOADING_COMPLETE_V206__=function(){
        pct=100;
        var bar=document.getElementById("standaloneProgress");
        var label=document.getElementById("standalonePercent");
        if(bar)bar.style.width="100%";
        if(label)label.textContent="100 %";
        clearInterval(timer);
      };
    })();
  </script>
