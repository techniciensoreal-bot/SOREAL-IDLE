<!doctype html>
<html lang="fr">
<head>

<title>Carte de boss : Ent</title>
<link rel="stylesheet" href="/cloudflare/public/soreal-idle-carte-boss.css">
<style>
  html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 30%,#1b2440,#070a14);font-family:system-ui,sans-serif;color:#e8ecff}
  body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px 40px}
  .note{max-width:520px;text-align:center;font-size:14px;color:#9aa6d4;line-height:1.45}

  .mtg-modal-v1{margin:0 auto}
</style>
</head>
<body>
<p class="note">Aperçu : la carte de chronique du boss « Ent », avec ton image. Les chiffres et le texte sont des exemples pour la mise en page. Clique sur l’illustration pour retourner la carte.</p>
<div class="scene"><div class="mtg-modal-v1" id="carte"></div></div>
<script src="/cloudflare/public/modules/carte-boss-magic-v1.js"></script>
<script>
(function(){
  window.__SOREAL_IDLE_REG__={formatGrandNombreIdleV70_:function(n){n=Number(n)||0;if(n>=1e9)return (n/1e9).toFixed(2).replace('.',',')+' Md';if(n>=1e6)return (n/1e6).toFixed(2).replace('.',',')+' M';if(n>=1e3)return (n/1e3).toFixed(1).replace('.',',')+' K';return String(Math.floor(n));}};
  var M=window.__SOREAL_IDLE_CARTE_BOSS_MAGIC_V1__;
  var notes='<div class="soreal-idle-boss-lore-info-v198">(Exemple : texte de déblocage du boss.)</div>';
  var histoire='<div class="soreal-idle-boss-lore-histoire-v142">Depuis des siècles, l’Ent veille sur la montagne. Ses racines connaissent chaque pierre, ses branches chaque orage. On dit que celui qui ose lui faire face entend le bois murmurer son nom. (Texte d’exemple pour la mise en page.)</div>';
  document.getElementById('carte').innerHTML=M.html({numero:18,nom:'Ent',monde:2,ordre:3,pv:4800000000,attaque:96000000,xp:182000,capacites:['Écorce épaisse'],notesHtml:notes,histoireHtml:histoire,image:'/cloudflare/tools/apercu-morts/ent.webp',boutonsHtml:'<button type="button" class="soreal-idle-chro-lecture-v1" style="padding:6px 18px;border-radius:9px;border:2px solid #1f1006;background:linear-gradient(180deg,#ffd75a,#ff8a1a);color:#2a1200;font:700 14px Georgia,serif;cursor:pointer">▶ Écouter</button>'});
})();
</script>
</body>
</html>
